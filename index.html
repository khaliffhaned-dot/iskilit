<style>
  html, body, #root {
    font-family: 'Lato', sans-serif;
    background-color: #f8fafc; /* slate-50 */
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .font-inter {
    font-family: 'Inter', sans-serif !important;
    text-transform: none !important;
    letter-spacing: normal !important;
  }
  
  @keyframes slide-fade-in-up {
      0% {
          opacity: 0;
          transform: translateY(20px);
      }
      100% {
          opacity: 1;
          transform: translateY(0);
      }
  }
  .animate-slide-fade-in-up {
      animation: slide-fade-in-up 0.6s ease-out forwards;
  }
  .fade-in {
    animation: fadeInAnimation 0.5s ease-in-out forwards;
  }
  @keyframes fadeInAnimation {
      0% {
          opacity: 0;
      }
      100% {
          opacity: 1;
      }
  }
  
  /* Styles for PDF Export */
  .exporting-to-pdf, .exporting-to-pdf * {
    box-shadow: none !important;
    text-shadow: none !important;
    transition: none !important;
    animation: none !important;
    border-color: #334155 !important; /* A dark gray border */
  }
  .print-hidden {
      display: initial;
  }
  .exporting-to-pdf .print-hidden {
      display: none !important;
  }
  
  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #f1f5f9; /* slate-100 */
  }
  ::-webkit-scrollbar-thumb {
    background: #94a3b8; /* slate-400 */
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #64748b; /* slate-500 */
  }

  /* Enhanced Button Styles */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    font-weight: 600;
    border-radius: 0.5rem;
    transition: all 0.2s ease-in-out;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary {
    background-color: #f59e0b; /* amber-500 */
    color: #020617; /* slate-950 */
    border-color: #f59e0b;
  }
  .btn-primary:hover {
    background-color: #fbbf24; /* amber-400 */
    border-color: #fbbf24;
    transform: translateY(-1px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .btn-primary:disabled {
    background-color: #cbd5e1; /* slate-300 */
    color: #64748b; /* slate-500 */
    border-color: #cbd5e1;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background-color: #e2e8f0; /* slate-200 */
    color: #1e293b; /* slate-800 */
    border-color: #cbd5e1; /* slate-300 */
  }
  .btn-secondary:hover {
    background-color: #cbd5e1; /* slate-300 */
    border-color: #94a3b8; /* slate-400 */
  }
  .btn-secondary:disabled {
    background-color: #f1f5f9; /* slate-100 */
    color: #94a3b8; /* slate-400 */
    border-color: #e2e8f0;
  }

  .bg-gradient-off-white {
    background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); /* slate-50 to slate-100 */
  }
  
  .text-dark-red {
      color: #991b1b;
  }

  /* Pulse animation for Logo */
  @keyframes pulse-dot-color {
    0%, 100% {
      color: #3b82f6; /* blue-500 */
      text-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
    }
    33% {
      color: #f59e0b; /* amber-500 */
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.7);
    }
    66% {
      color: #ef4444; /* red-500 */
      text-shadow: 0 0 5px rgba(239, 68, 68, 0.5);
    }
  }
  .pulse-dot {
    display: inline-block;
    animation: pulse-dot-color 3s infinite ease-in-out;
  }

  /* Staggered Entrance Animations */
  .animate-fade-in-up {
    animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  
  /* Stagger delays */
  .delay-100 { animation-delay: 100ms; }
  .delay-200 { animation-delay: 200ms; }
  .delay-300 { animation-delay: 300ms; }
  .delay-400 { animation-delay: 400ms; }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Card Colors */
  .card-color-1 { 
    background-color: rgba(224, 231, 255, 0.45) !important; 
    border-color: rgba(165, 180, 252, 0.4) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
  }
  .card-color-2 { 
    background-color: rgba(204, 251, 241, 0.45) !important; 
    border-color: rgba(153, 246, 228, 0.4) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
  }
  .card-color-3 { 
    background-color: rgba(224, 242, 254, 0.45) !important; 
    border-color: rgba(186, 230, 253, 0.4) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
  }
  .card-color-4 { 
    background-color: rgba(255, 228, 230, 0.45) !important; 
    border-color: rgba(254, 205, 211, 0.4) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
  }
  .card-color-5 { 
    background-color: rgba(254, 243, 199, 0.45) !important;
    border-color: rgba(245, 158, 11, 0.35) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
  }
  .card-color-6 { 
    background-color: rgba(240, 253, 244, 0.45) !important;
    border-color: rgba(74, 222, 128, 0.35) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
  }

  /* Collapsible Sidebar Styles */
  .sidebar-container {
      transition: width 0.3s ease-in-out;
  }
  .sidebar-text, .sidebar-chevron {
      transition: opacity 0.2s ease-in-out, transform 0.3s ease-in-out;
  }
  .sidebar-collapsed .sidebar-text, .sidebar-collapsed .sidebar-chevron {
      opacity: 0;
      transform: translateX(-10px);
      pointer-events: none;
      width: 0;
  }
  
  .partner-logos {
      display: flex;
      align-items: center;
      gap: 1.5rem; /* 24px */
      margin-top: 2rem; /* 32px */
  }
  .partner-logos img {
      height: 2rem; /* 32px */
      width: auto;
      opacity: 0.6;
      filter: grayscale(80%);
      transition: all 0.2s ease-in-out;
  }
  .partner-logos img:hover {
      opacity: 1;
      filter: grayscale(0%);
  }
</style>
